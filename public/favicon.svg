<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <!-- Circular clip path -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Light background so dark image is visible -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  <!-- Blue glow border -->
  <circle cx="256" cy="256" r="248" stroke="#0066ff" stroke-width="8" fill="none" filter="url(#glow)"/>
  <!-- Tab header icon clipped to circle -->
  <image href="tab-icon.png" x="0" y="0" width="512" height="512" clip-path="url(#circleClip)"/>
</svg>
